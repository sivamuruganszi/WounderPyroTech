name = "wonderpyrotech-whatsapp"
main = "src/index.js"
compatibility_date = "2026-08-20"

# Non-secret config. Secrets (OWNER_WHATSAPP_NUMBER, SITE_KEY,
# FAST2SMS_API_KEY) are set separately with `wrangler secret put <NAME>` —
# see README.md — so they never end up in this file or in git.
[vars]
ALLOWED_ORIGIN = "https://sivamuruganszi.github.io"

# Fast2SMS WhatsApp template identifiers. Not secrets — like the old
# WHATSAPP_TEMPLATE_SID, these just identify a template/number, they don't
# grant access to anything on their own (FAST2SMS_API_KEY does that).
# WABA number connected and template approved in the Fast2SMS panel — see
# worker/README.md for how these were obtained.
FAST2SMS_WHATSAPP_MESSAGE_ID = "30047"
FAST2SMS_WHATSAPP_PHONE_NUMBER_ID = "1364963933356640"
